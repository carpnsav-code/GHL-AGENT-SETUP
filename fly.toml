# Fly.io: `fly launch --copy-config --yes`, then `fly volumes create data --size 1`
app = "mint-concrete"
primary_region = "phx"

[build]

[env]
  MC_DB_FILE = "/data/mint-concrete.sqlite"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"
